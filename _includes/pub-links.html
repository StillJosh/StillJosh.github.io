{% assign p = include.p %}{% assign kinds = "pdf,code,web" | split: "," %}<div class="pub-links">{% for k in kinds %}{% if p.links[k] %}<a href="{{ p.links[k] }}">{{ k }}</a>{% endif %}{% endfor %}{% if p.bibtex %}<button type="button" class="pub-bib" data-bib="{{ p.bibtex | strip | escape }}">bib</button>{% endif %}</div>
