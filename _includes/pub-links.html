{% assign p = include.p %}{% assign kinds = "neurips,pdf,code,web" | split: "," %}<div class="pub-links">{% if p.blog and include.hide_blog == nil %}<a class="pub-blog" href="{{ p.blog | relative_url }}">blog</a>{% endif %}{% for k in kinds %}{% if p.links[k] %}<a href="{{ p.links[k] }}">{{ k }}</a>{% endif %}{% endfor %}{% if p.bibtex %}<button type="button" class="pub-bib" data-bib="{{ p.bibtex | strip | escape }}">bib</button>{% endif %}</div>
